<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zahlung an Mich</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .payment-card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .logo {
            width: 80px;
            height: 80px;
            background-color: #0070ba; /* Platzhalter Farbe */
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 24px;
        }
        /* Falls du ein echtes Bild nutzt:
        .logo-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; } 
        */
        h1 { font-size: 1.2rem; color: #333; margin-bottom: 0.5rem; }
        p { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
        
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 1rem;
        }
        .amount-btn {
            background: #eef2f5;
            border: 1px solid #dce1e5;
            border-radius: 8px;
            padding: 10px 0;
            cursor: pointer;
            font-weight: 600;
            color: #0070ba;
            transition: all 0.2s;
        }
        .amount-btn:hover { background: #e1e7ec; }
        
        .input-group {
            display: flex;
            margin-bottom: 1.5rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }
        .currency-symbol {
            background: #f9f9f9;
            padding: 10px 15px;
            color: #555;
            border-right: 1px solid #ccc;
        }
        input[type="number"] {
            border: none;
            padding: 10px;
            width: 100%;
            font-size: 1rem;
            outline: none;
        }
        
        .pay-btn {
            background-color: #0070ba;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .pay-btn:hover { background-color: #005ea6; }
    </style>
</head>
<body>

<div class="payment-card">
    <div class="logo"><a href="http://www.dirkbundies.de/DirkBundies2017_61kB.jpg">DB</a></div> 
    <h1>Kaffeekasse / Projekt-Support</h1>
    <p>Wähle einen Betrag für die Unterstützung.</p>

    <div class="button-grid">
        <button class="amount-btn" onclick="setAmount(1)">1€</button>
        <button class="amount-btn" onclick="setAmount(5)">5€</button>
        <button class="amount-btn" onclick="setAmount(10)">10€</button>
        <button class="amount-btn" onclick="setAmount(20)">20€</button>
    </div>

    <div class="input-group">
        <span class="currency-symbol">€</span>
        <input type="number" id="amountInput" placeholder="Freier Betrag" step="0.01" min="1">
    </div>

    <button class="pay-btn" onclick="processPayment()">Jetzt per PayPal zahlen</button>
</div>

<script>
    // HIER DEINEN PAYPAL.ME NAMEN EINTRAGEN
    const paypalMeUser = "dirkbundies"; 

    function setAmount(val) {
        document.getElementById('amountInput').value = val;
    }

    function processPayment() {
        const amount = document.getElementById('amountInput').value;
        
        if (!amount || amount <= 0) {
            alert("Bitte gib einen gültigen Betrag ein.");
            return;
        }

        // Ersetzt Komma durch Punkt für URL-Kompatibilität, falls nötig
        const cleanAmount = amount.replace(',', '.');
        
        // Baut den Link: paypal.me/USER/BETRAGEUR
        // Beispiel: https://paypal.me/MaxMustermann/10EUR
        const url = `https://www.paypal.com/paypalme/${paypalMeUser}/${cleanAmount}EUR`;
        
        window.location.href = url;
    }
</script>

</body>
</html>
