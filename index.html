<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zahlung an Mich</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .payment-card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        /* CSS für das Bild-Logo */
        .logo-img { 
            width: 80px; 
            height: 80px; 
            border-radius: 50%; /* Macht das Bild rund */
            object-fit: cover; /* Stellt sicher, dass das Bild den Kreis ausfüllt */
            margin: 0 auto 1rem; /* Zentriert und Abstand nach unten */
            display: block; 
        } 
        
        h1 { 
            font-size: 1.2rem; 
            color: #333; 
            margin-bottom: 0.2rem; /* Weniger Abstand, da ein Link folgt */
        }
        .subtitle-link {
            font-size: 0.85rem;
            color: #0070ba;
            text-decoration: none;
            margin-top: 0;
            margin-bottom: 1rem; /* Abstand nach unten zum nächsten Element */
            display: block; /* Für korrekten Margin */
        }
        .subtitle-link:hover {
            text-decoration: underline;
        }

        p { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
        
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 1rem;
        }
        .amount-btn {
            background: #eef2f5;
            border: 1px solid #dce1e5;
            border-radius: 8px;
            padding: 10px 0;
            cursor: pointer;
            font-weight: 600;
            color: #0070ba;
            transition: all 0.2s;
            display: flex; /* Für Icon und Text nebeneinander */
            flex-direction: column; /* Icon über Text */
            align-items: center;
            justify-content: center;
            height: 70px; /* Einheitliche Höhe für alle Buttons */
        }
        .amount-btn img {
            width: 35px; /* Größe der Geldschein-Icons */
            height: auto;
            margin-bottom: 5px; /* Abstand zwischen Bild und Text */
            filter: grayscale(80%); /* Leicht entsättigt für konsistenteres Design */
            transition: filter 0.2s;
        }
        .amount-btn:hover { background: #e1e7ec; }
        .amount-btn:hover img {
            filter: grayscale(0%); /* Farbe beim Hover */
        }
        
        .input-group {
            display: flex;
            margin-bottom: 1.5rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }
        .currency-symbol {
            background: #f9f9f9;
            padding: 10px 15px;
            color: #555;
            border-right: 1px solid #ccc;
        }
        input[type="number"] {
            border: none;
            padding: 10px;
            width: 100%;
            font-size: 1rem;
            outline: none;
        }
        
        .pay-btn {
            background-color: #0070ba;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .pay-btn:hover { background-color: #005ea6; }
    </style>
</head>
<body>

<div class="payment-card">
    <img src="https://images.weserv.nl/?url=www.dirkbundies.de/DirkBundies2017_61kB.jpg" class="logo-img" alt="Logo Dirk Bundies">
    
    <h1>Kaffeekasse / Projekt-Support</h1>
    <a href="https://www.dirkbundies.de" class="subtitle-link" target="_blank">www.dirkbundies.de</a>
    
    <p>Wähle einen Betrag für die Unterstützung.</p>

    <div class="button-grid">
        <button class="amount-btn" onclick="setAmount(1)">
            <img src="https://upload.wikimedia.org/wikipedia/de/c/ca/1_Euro_Common_Sides_New_Design.gif" alt="1 Euro Schein">
            1€
        </button>
        <button class="amount-btn" onclick="setAmount(5)">
            <img src="https://openclipart.org/image/400px/185583" alt="5 Euro Schein">
            5€
        </button>
        <button class="amount-btn" onclick="setAmount(10)">
            <img src="https://openclipart.org/image/400px/184845" alt="10 Euro Schein">
            10€
        </button>
        <button class="amount-btn" onclick="setAmount(20)">
            <img src="https://openclipart.org/image/400px/185878" alt="20 Euro Schein">
            20€
        </button>
    </div>

    <div class="input-group">
        <span class="currency-symbol">€</span>
        <input type="number" id="amountInput" placeholder="Freier Betrag" step="0.01" min="1">
    </div>

    <button class="pay-btn" onclick="processPayment()">Jetzt per PayPal zahlen</button>
</div>

<script>
    const paypalMeUser = "dirkbundies"; 

    function setAmount(val) {
        document.getElementById('amountInput').value = val;
    }

    function processPayment() {
        const amount = document.getElementById('amountInput').value;
        
        if (!amount || amount <= 0) {
            alert("Bitte gib einen gültigen Betrag ein.");
            return;
        }

        const cleanAmount = amount.replace(',', '.');
        const url = `https://www.paypal.com/paypalme/${paypalMeUser}/${cleanAmount}EUR`;
        
        window.location.href = url;
    }
</script>

</body>
</html>
